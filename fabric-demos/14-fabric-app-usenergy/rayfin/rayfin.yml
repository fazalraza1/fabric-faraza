id: fabric-app-usenergy
name: U.S. Energy Explorer
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  data:
    enabled: false
  storage:
    enabled: false
  functions:
    enabled: false
connectors:
  - name: stateenergylakehouse
    type: fabric-sqlanalytics
    config:
      workspaceId: <FABRIC_WORKSPACE_ID>
      itemId: <LAKEHOUSE_ITEM_ID>
    auth:
      type: application
    operations:
      - name: read
